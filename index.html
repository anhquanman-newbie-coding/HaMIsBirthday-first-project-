    <footer>
        <h1 style="font-size: 20px;"class="odd"; id="h1"> Chú code đến đây thôi thế này mỏi lắm rồi:3</h1>
    </footer>
 
<script>
  document.querySelectorAll('.carousel-container').forEach(container => {
    let currentIndex = 0;
    const items = container.querySelectorAll('.carousel-item');
    const total = items.length;
    const prevBtn = container.querySelector('.prev');
    const nextBtn = container.querySelector('.next');

    function update() {
      items.forEach((item, i) => {
        let offset = (i - currentIndex) % total;
        if (offset < -Math.floor(total / 2)) offset += total;
        if (offset > Math.floor((total - 1) / 2)) offset -= total;

        const absOffset = Math.abs(offset);

        if (absOffset > 2) {
          item.style.opacity = '0';
          item.style.transform = `translateX(${offset * 140}px) scale(0.4)`;
          item.style.zIndex = '0';
          item.style.pointerEvents = 'none';
        } else {
          const translateX = offset * 130; 
          const scale = 1 - absOffset * 0.2;
          const zIndex = 10 - absOffset;
          const opacity = 1 - absOffset * 0.3;
          item.style.opacity = opacity;
          item.style.transform = `translateX(${translateX}px) scale(${scale})`;
          item.style.zIndex = zIndex;
          item.style.pointerEvents = offset === 0 ? 'auto' : 'none';
        }
      });
    }
    prevBtn.addEventListener('click', () => {
      currentIndex = (currentIndex - 1 + total) % total;
      update();
    });
    nextBtn.addEventListener('click', () => {
      currentIndex = (currentIndex + 1) % total;
      update();
    });
    update();
  });
</script>
